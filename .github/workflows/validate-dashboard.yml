name: Validate dashboard changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ai-even-odd-dashboard]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Netlify function syntax
        run: node --check netlify/functions/trade-journal.mjs

      - name: Run unit tests
        run: npm test -- --runInBand --runTestsByPath src/pages/dashboard/even-odd-analysis-engine.test.ts src/pages/dashboard/even-odd-parity-engine.test.ts src/pages/dashboard/even-odd-parity-execution.test.ts src/pages/dashboard/digit-matches-engine.test.ts src/pages/dashboard/over-two-engine.test.ts src/pages/dashboard/over-two-execution.test.ts src/pages/dashboard/market-metrics-engine.test.ts src/trading-engine/execution.test.ts src/trading-engine/strategy-adapters.test.ts src/trading-engine/runtime.test.ts

      - name: Run TypeScript check
        run: npm run type-check

      - name: Build production bundle
        run: npm run build
